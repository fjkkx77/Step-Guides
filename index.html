<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<title>图文教程</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 2026-09-26 改版：内容与结构沿用原版（标题/介绍/三个入口/隐私提示），只改两件事——
     ① 按钮更醒目：主按钮做成实心大按钮，另两个入口带彩色图标和说明
     ② 按 Apple HIG 排版（原文查过，出处见各段注释）

     HIG · Layout：「把最重要的内容放在靠顶部、靠起始边的位置」→ 内容从顶部往下排，**不上下居中**
     （上一版居中过，用户让我去查 HIG 才发现是错的）；大屏上整栏水平居中 */
  body{
    min-height:100dvh;
    padding:calc(44px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:520px;margin:0 auto;width:100%}

  /* HIG · Typography：iOS 默认档 Large Title = 34pt / 行高 41pt，粗体；Body = 17pt。
     （上一版标题上方放过一个"应用图标"——iOS 自己的 App 首页不会这么放，是我加的，已去掉） */
  h1{margin:0 0 8px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px}
  .lead{margin:0 0 28px;color:var(--ink2);font-size:17px;line-height:1.6}

  /* HIG · Buttons：「最可能的操作用醒目样式（强调色填充背景），一个视图里保持一到两个」
     「主操作优先用横跨屏幕宽度的按钮」。醒目靠填充色，不靠阴影（上一版的紫色光晕是我加的装饰，已去掉） */
  .primary{
    display:flex;align-items:center;justify-content:center;gap:10px;
    height:54px;border-radius:14px;margin-bottom:28px;
    background:var(--brand);color:#fff;text-decoration:none;
    font-size:17px;font-weight:600;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), filter .16s ease;
  }
  .primary svg{width:20px;height:20px}
  .primary:active{transform:scale(.97);filter:brightness(.92)}
  @media (hover:hover){ .primary:hover{filter:brightness(1.06)} }

  /* HIG · Lists and tables：「iOS 的 grouped 样式用页眉、页脚和额外间距来分隔各组数据」
     「行首放一张小图，后面跟一句简短说明」「能钻进下一层的行用 disclosure indicator（右侧 ›）」 */
  .group{background:var(--card);border-radius:14px;overflow:hidden}
  .row{
    display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 16px;
    color:var(--ink);text-decoration:none;position:relative;
    transition:background-color .15s ease;
  }
  .row + .row::before{content:"";position:absolute;top:0;right:0;left:66px;height:1px;background:var(--line)}
  .row:active{background:rgba(120,120,130,.16)}
  @media (hover:hover){ .row:hover{background:rgba(120,120,130,.08)} }
  .ico{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff}
  .ico svg{width:21px;height:21px}
  .ico.blue{background:linear-gradient(180deg,#4DA3FF,#0A7AFF)}
  .ico.orange{background:linear-gradient(180deg,#FFB340,#FF8A00)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:17px;font-weight:600;line-height:1.35}
  .txt span{display:block;margin-top:2px;font-size:14px;color:var(--muted);line-height:1.45}
  .chev{flex:0 0 auto;width:9px;height:15px;color:rgba(60,60,67,.3)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chev{color:rgba(235,235,245,.3)} }
  :root[data-theme="dark"] .chev{color:rgba(235,235,245,.3)}

  /* 分组脚注：iOS 表格分组下方的小字说明 */
  .foot{display:flex;gap:8px;margin:10px 16px 0;font-size:13px;color:var(--muted);line-height:1.7}
  .foot svg{flex:0 0 auto;width:14px;height:14px;margin-top:4px}

  /* 电脑：整栏水平居中（HIG：很大的尺寸下"让内容保持水平居中"），顶部留白多一点 */
  @media (min-width:900px){
    body{padding-top:calc(12vh + env(safe-area-inset-top))}
    .wrap{max-width:580px}          /* 介绍那句 33 字 × 17px ≈ 561px：560 会剩「做。」孤字 */
  }
  /* 320 宽：一行只放得下 16 个 17px 的字，33 字的介绍会剩一个「做。」掉到第三行；16px 一行 17 字，正好两行 */
  @media (max-width:360px){ .lead{font-size:16px} }
  /* 矮屏（320×568 这类）：一屏放下全部内容，只压间距，不换版式 */
  @media (max-height:640px){
    body{padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .lead{margin-bottom:20px}
    .primary{margin-bottom:20px}
  }

  @media (prefers-reduced-motion: reduce){ .primary,.row{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>图文教程</h1>
  <p class="lead">把截图和说明写成一步一屏的教程，发一条链接给对方，点开就能跟着做。</p>

  <a class="primary" href="w/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    写一份新教程
  </a>

  <nav class="group" aria-label="更多入口">
    <a class="row" href="mine/">
      <span class="ico blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>
      </span>
      <span class="txt"><b>我发布过的教程</b><span>打开、复制链接、编辑</span></span>
      <svg class="chev" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg>
    </a>
    <a class="row" href="t/qhftq5kz/">
      <span class="ico orange" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </span>
      <span class="txt"><b>看个例子</b><span>iPhone 专注模式 · 12 步</span></span>
      <svg class="chev" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg>
    </a>
  </nav>

  <p class="foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span>教程链接是随机字符串，猜不到、也不会被搜索引擎收录；但拿到链接的人都能看，所以别放真正敏感的东西。</span>
  </p>
</div>
</body>
</html>
