<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<title>我的教程</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/writer.css">
<style>
  .list{padding:12px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;
  }
  .card h2{margin:0 0 2px;font-size:17px;font-weight:600;line-height:1.4}
  .card .meta{font-size:13px;color:var(--muted)}
  .card .ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .card .ops button,.card .ops a{
    height:44px;padding:0 14px;border-radius:10px;font-size:15px;
    background:var(--bg);border:1px solid var(--line);color:var(--ink);
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .card .ops .go{background:var(--brand);color:#fff;border-color:transparent}
</style>
</head>
<body>

<header class="wtop">
  <input id="title" type="text" value="我的教程" readonly>
  <button class="iconbtn tap" id="btn-new" type="button" aria-label="新建">＋</button>
</header>

<main class="list" id="list"><div class="empty">正在读取…</div></main>

<script>
(async () => {
  const list = document.getElementById('list');
  document.getElementById('btn-new').onclick = () => location.href = '../w/';
  try {
    const r = await fetch('../list.json?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = await r.json();
    if (!items.length) { list.innerHTML = '<div class="empty">还没有发布过教程。<br>点右上角的 ＋ 开始写第一份。</div>'; return; }
    list.innerHTML = items.map(it => {
      const url = '../t/' + it.id + '/';
      const when = (it.updated || '').slice(0, 10);
      return `<article class="card">
        <h2>${it.title.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</h2>
        <div class="meta">${it.steps} 步 · ${when} · /t/${it.id}/</div>
        <div class="ops">
          <a class="go tap" href="${url}">打开</a>
          <button class="tap" data-copy="${url}" type="button">复制链接</button>
          <a class="tap" href="../w/?edit=${it.id}">编辑</a>
        </div>
      </article>`;
    }).join('');
    list.addEventListener('click', async e => {
      const b = e.target.closest('button[data-copy]');
      if (!b) return;
      const abs = new URL(b.dataset.copy, location.href).href;
      try { await navigator.clipboard.writeText(abs); b.textContent = '已复制 ✓'; }
      catch (err) { prompt('手动复制：', abs); }
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">还没有 list.json（发布第一份教程后就会自动生成）</div>';
  }
})();
</script>
</body>
</html>
